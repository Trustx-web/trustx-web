<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trust-X — Transaction Risk Intelligence Infrastructure</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              cyan: '#06b6d4',
              indigo: '#6366f1',
              dark: '#0B0F17',
              card: '#111827',
              border: '#1F2937'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM, and Babel for browser-side JSX transpilation -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0B0F17] text-slate-100 min-h-screen font-sans antialiased selection:bg-cyan-500 selection:text-black">

  <div id="root"></div>

  <!-- Note: type="text/babel" is required for Babel to transpile JSX live -->
  <script type="text/babel">
    const { useState, useMemo } = React;

    // --- TRUST-X SVG LOGO ---
    const TrustXLogo = () => (
      <div class="flex items-center gap-2.5">
        <svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="shrink-0">
          <defs>
            <linearGradient id="backCard" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#3B82F6" />
              <stop offset="100%" stopColor="#8B5CF6" />
            </linearGradient>
            <linearGradient id="frontCard" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#A855F7" />
              <stop offset="100%" stopColor="#C084FC" />
            </linearGradient>
          </defs>
          <rect x="15" y="25" width="55" height="40" rx="10" fill="url(#backCard)" transform="skewX(-15)" />
          <rect x="35" y="40" width="55" height="40" rx="10" fill="url(#frontCard)" transform="skewX(-15)" />
        </svg>
        <span class="text-xl font-bold tracking-tight text-white font-mono">
          Trust<span class="text-cyan-400">-X</span>
        </span>
      </div>
    );

    // --- MAIN APPLICATION COMPONENT ---
    function App() {
      const [pricingMode, setPricingMode] = useState('saas');
      const [isAccessModalOpen, setIsAccessModalOpen] = useState(false);
      const [isDocsOpen, setIsDocsOpen] = useState(false);
      const [requestSubmitted, setRequestSubmitted] = useState(false);
      const [copied, setCopied] = useState(false);

      // Interactive Simulator State
      const [addressHistory, setAddressHistory] = useState('unverified');
      const [deviceRisk, setDeviceRisk] = useState('normal');
      const [velocity, setVelocity] = useState('high');
      const [paymentMethod, setPaymentMethod] = useState('COD');
      const [isEvaluating, setIsEvaluating] = useState(false);

      // ROI Calculator State
      const [monthlyOrders, setMonthlyOrders] = useState(15000);
      const [currentRtoRate, setCurrentRtoRate] = useState(22);
      const [avgFreightCost, setAvgFreightCost] = useState(140);

      // M10.1 Evaluation Logic Calculation
      const simulatorOutput = useMemo(() => {
        let score = 10;
        let flags = [];

        if (addressHistory === 'unverified') {
          score += 35;
          flags.push('MISSING_DOOR_NUM_OR_LANDMARK');
        } else if (addressHistory === 'blacklisted') {
          score += 65;
          flags.push('FLAGGED_ADDRESS_PATTERN_MATCH');
        }

        if (deviceRisk === 'proxy') {
          score += 25;
          flags.push('HIGH_RISK_VPN_OR_PROXY');
        } else if (deviceRisk === 'emu') {
          score += 45;
          flags.push('EMULATOR_DEVICE_FINGERPRINT');
        }

        if (velocity === 'high') {
          score += 20;
          flags.push('PAYMENT_SESSION_VELOCITY_SPREE');
        }

        if (paymentMethod === 'COD') {
          score += 10;
        } else {
          score = Math.max(5, score - 25);
        }

        let decision = 'APPROVE';
        let merchantControl = 'APPROVE';

        if (score >= 70) {
          decision = 'INSPECT';
          merchantControl = 'PREPAID_REQUIRED';
        } else if (score >= 50) {
          decision = 'REVIEW';
          merchantControl = 'MANUAL_REVIEW';
        } else if (score >= 40) {
          decision = 'VERIFY';
          merchantControl = 'ADDITIONAL_VERIFICATION';
        }

        return {
          api_version: 'v1',
          endpoint: '/v1/risk/evaluate',
          mode: 'SIMULATION',
          risk_score: score,
          decision: decision,
          merchant_control: merchantControl,
          thresholds_applied: { inspect: 70, verify: 40, approve_below: 40 },
          evaluation_details: {
            authoritative_store: 'postgresql',
            velocity_cache_status: 'degraded_optional_projection',
            risk_flags: flags
          }
        };
      }, [addressHistory, deviceRisk, velocity, paymentMethod]);

      // RTO Calculations
      const rtoCalculations = useMemo(() => {
        const totalCodOrders = monthlyOrders * 0.65;
        const currentRtoOrders = totalCodOrders * (currentRtoRate / 100);
        const currentRtoLoss = currentRtoOrders * avgFreightCost;

        const projectedRtoRate = Math.max(6, currentRtoRate * 0.65);
        const newRtoOrders = totalCodOrders * (projectedRtoRate / 100);
        const newRtoLoss = newRtoOrders * avgFreightCost;
        const monthlySavings = currentRtoLoss - newRtoLoss;

        return {
          currentLoss: Math.round(currentRtoLoss),
          newLoss: Math.round(newRtoLoss),
          monthlySavings: Math.round(monthlySavings),
          reducedRate: projectedRtoRate.toFixed(1)
        };
      }, [monthlyOrders, currentRtoRate, avgFreightCost]);

      const triggerEvaluation = () => {
        setIsEvaluating(true);
        setTimeout(() => setIsEvaluating(false), 200);
      };

      const copySnippet = () => {
        navigator.clipboard?.writeText(JSON.stringify(simulatorOutput, null, 2));
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div class="min-h-screen bg-[#0B0F17] text-slate-100 flex flex-col font-sans">
          
          <!-- Navigation -->
          <header class="sticky top-0 z-40 backdrop-blur-md bg-[#0B0F17]/80 border-b border-slate-800/80 px-6 py-4">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
              <TrustXLogo />
              <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-400">
                <a href="#architecture" class="hover:text-cyan-400 transition-colors">Architecture</a>
                <a href="#simulator" class="hover:text-cyan-400 transition-colors">Risk Simulator</a>
                <a href="#pricing" class="hover:text-cyan-400 transition-colors">Commercials</a>
                <button onClick={() => setIsDocsOpen(true)} class="hover:text-cyan-400 transition-colors">
                  API Reference
                </button>
              </nav>
              <button 
                onClick={() => setIsAccessModalOpen(true)} 
                class="px-4 py-2 text-xs font-semibold rounded-lg bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-black font-mono transition-all shadow-md shadow-cyan-500/20"
              >
                Request API Access
              </button>
            </div>
          </header>

          <!-- Hero Section -->
          <section class="max-w-7xl mx-auto px-6 pt-20 pb-16 text-center md:text-left grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
            <div class="space-y-6">
              <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-cyan-500/30 bg-cyan-500/10 text-cyan-400 text-xs font-mono">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                API-First Risk Engine — Verified M10.1
              </div>
              <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight text-white leading-tight">
                Transaction Risk Intelligence Infrastructure
              </h1>
              <p class="text-lg text-slate-400 leading-relaxed max-w-xl">
                API-first transaction risk intelligence for e-commerce, with real-time risk scoring, decisioning, and merchant-controlled actions.
              </p>
              <div class="flex flex-wrap items-center gap-4 pt-2">
                <button 
                  onClick={() => setIsAccessModalOpen(true)}
                  class="px-6 py-3 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-black font-semibold text-sm transition-all shadow-lg shadow-cyan-500/25"
                >
                  Request API Access
                </button>
                <a 
                  href="#simulator" 
                  class="px-6 py-3 rounded-lg border border-slate-800 bg-slate-900/50 hover:bg-slate-800 text-slate-300 font-semibold text-sm transition-all"
                >
                  Open Simulator
                </a>
              </div>
            </div>

            <!-- Architecture Badge Grid -->
            <div class="p-6 rounded-2xl border border-slate-800 bg-slate-900/40 backdrop-blur-sm space-y-4">
              <div class="text-xs font-mono text-slate-400 uppercase tracking-wider pb-2 border-b border-slate-800">
                Verified System State
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div class="p-4 rounded-xl border border-slate-800 bg-slate-950/60">
                  <div class="text-xs text-slate-500 font-mono">PRIMARY ENDPOINT</div>
                  <div class="text-sm font-semibold text-cyan-400 font-mono mt-1">POST /v1/risk/evaluate</div>
                </div>
                <div class="p-4 rounded-xl border border-slate-800 bg-slate-950/60">
                  <div class="text-xs text-slate-500 font-mono">AUTHORITATIVE STORE</div>
                  <div class="text-sm font-semibold text-indigo-400 font-mono mt-1">PostgreSQL Core</div>
                </div>
                <div class="p-4 rounded-xl border border-slate-800 bg-slate-950/60">
                  <div class="text-xs text-slate-500 font-mono">CACHE STRATEGY</div>
                  <div class="text-sm font-semibold text-purple-400 font-mono mt-1">Redis Projection</div>
                </div>
                <div class="p-4 rounded-xl border border-slate-800 bg-slate-950/60">
                  <div class="text-xs text-slate-500 font-mono">DECISION CONTRACT</div>
                  <div class="text-sm font-semibold text-emerald-400 font-mono mt-1">70 / 40 / 0 Thresholds</div>
                </div>
              </div>
            </div>
          </section>

          <!-- Interactive Risk Simulator -->
          <section id="simulator" class="max-w-7xl mx-auto px-6 py-16 w-full">
            <div class="text-center max-w-2xl mx-auto mb-12">
              <h2 class="text-3xl font-bold text-white">Interactive Risk Simulator</h2>
              <p class="text-slate-400 text-sm mt-2">
                Simulated demonstration of Trust-X decision concepts. Select transaction vectors to preview rule evaluation outputs.
              </p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
              <!-- Parameter Selection -->
              <div class="lg:col-span-5 p-6 rounded-2xl border border-slate-800 bg-slate-900/50 space-y-6">
                <h3 class="text-sm font-semibold text-slate-300 font-mono uppercase tracking-wider">
                  Transaction Signals
                </h3>

                <div class="space-y-2">
                  <label class="text-xs text-slate-400 font-medium">Address History</label>
                  <select 
                    value={addressHistory} 
                    onChange={(e) => { setAddressHistory(e.target.value); triggerEvaluation(); }}
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-cyan-500 outline-none"
                  >
                    <option value="verified">Verified Delivery History</option>
                    <option value="unverified">Unverified / Missing Door Number</option>
                    <option value="blacklisted">Flagged Address Pattern</option>
                  </select>
                </div>

                <div class="space-y-2">
                  <label class="text-xs text-slate-400 font-medium">Device & Network Vector</label>
                  <select 
                    value={deviceRisk} 
                    onChange={(e) => { setDeviceRisk(e.target.value); triggerEvaluation(); }}
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-cyan-500 outline-none"
                  >
                    <option value="normal">Standard Consumer Device</option>
                    <option value="proxy">VPN / High-Risk Proxy IP</option>
                    <option value="emu">Emulator / Fingerprint Mismatch</option>
                  </select>
                </div>

                <div class="space-y-2">
                  <label class="text-xs text-slate-400 font-medium">Velocity Spree</label>
                  <select 
                    value={velocity} 
                    onChange={(e) => { setVelocity(e.target.value); triggerEvaluation(); }}
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-cyan-500 outline-none"
                  >
                    <option value="normal">Standard Single Checkout</option>
                    <option value="high">High Velocity (Multiple Sessions/Min)</option>
                  </select>
                </div>

                <div class="space-y-2">
                  <label class="text-xs text-slate-400 font-medium">Payment Mode</label>
                  <select 
                    value={paymentMethod} 
                    onChange={(e) => { setPaymentMethod(e.target.value); triggerEvaluation(); }}
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-cyan-500 outline-none"
                  >
                    <option value="COD">Cash on Delivery (COD)</option>
                    <option value="PREPAID">Prepaid (UPI / Card)</option>
                  </select>
                </div>
              </div>

              <!-- Output JSON Panel -->
              <div class="lg:col-span-7 rounded-2xl border border-slate-800 bg-slate-950 overflow-hidden flex flex-col font-mono text-xs">
                <div class="bg-slate-900 px-4 py-3 border-b border-slate-800 flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-red-500/80"></span>
                    <span class="w-3 h-3 rounded-full bg-yellow-500/80"></span>
                    <span class="w-3 h-3 rounded-full bg-green-500/80"></span>
                    <span class="text-slate-400 ml-2 font-mono">POST /v1/risk/evaluate</span>
                  </div>
                  <div class="flex items-center gap-3">
                    <span class="text-[10px] text-amber-400 border border-amber-500/30 bg-amber-500/10 px-2 py-0.5 rounded">
                      SIMULATED EVALUATION
                    </span>
                    <button onClick={copySnippet} class="text-slate-400 hover:text-white transition-colors">
                      {copied ? 'Copied!' : 'Copy JSON'}
                    </button>
                  </div>
                </div>

                <div class="p-6 overflow-x-auto flex-1 text-slate-300 leading-relaxed">
                  <pre>{JSON.stringify(simulatorOutput, null, 2)}</pre>
                </div>
              </div>
            </div>
          </section>

          <!-- Core System Features -->
          <section id="architecture" class="max-w-7xl mx-auto px-6 py-16 w-full border-t border-slate-800/80">
            <div class="text-center max-w-2xl mx-auto mb-12">
              <h2 class="text-3xl font-bold text-white">System Architecture & Capabilities</h2>
              <p class="text-slate-400 text-sm mt-2">Built for low-latency decisioning with strict state isolation.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="p-6 rounded-2xl border border-slate-800 bg-slate-900/30">
                <h3 class="text-lg font-bold text-white mb-2">Real-Time Transaction Risk Decisioning</h3>
                <p class="text-slate-400 text-sm leading-relaxed">
                  Evaluate transaction, customer, device, address, velocity, payment, return, and network signals through a single unified API.
                </p>
              </div>

              <div class="p-6 rounded-2xl border border-slate-800 bg-slate-900/30">
                <h3 class="text-lg font-bold text-white mb-2">COD & RTO Risk Controls</h3>
                <p class="text-slate-400 text-sm leading-relaxed">
                  Identify elevated COD and return-risk patterns and return merchant-configured controls such as verification, manual review, or prepaid requirements.
                </p>
              </div>

              <div class="p-6 rounded-2xl border border-slate-800 bg-slate-900/30">
                <h3 class="text-lg font-bold text-white mb-2">Cross-Merchant Intelligence</h3>
                <p class="text-slate-400 text-sm leading-relaxed">
                  Use available customer, device, address, and network relationships to identify connected transaction risk.
                </p>
              </div>

              <div class="p-6 rounded-2xl border border-slate-800 bg-slate-900/30">
                <h3 class="text-lg font-bold text-white mb-2">Safe Degraded Operation</h3>
                <p class="text-slate-400 text-sm leading-relaxed">
                  PostgreSQL remains authoritative while Redis serves as a performance projection. Dependency failures are contained without silently changing risk semantics.
                </p>
              </div>
            </div>
          </section>

          <!-- Pricing & ROI Section -->
          <section id="pricing" class="max-w-7xl mx-auto px-6 py-16 w-full border-t border-slate-800/80">
            <div class="text-center max-w-2xl mx-auto mb-12">
              <h2 class="text-3xl font-bold text-white">Commercial Structure & ROI</h2>
              <div class="inline-flex rounded-lg bg-slate-900 p-1 border border-slate-800 mt-4">
                <button 
                  onClick={() => setPricingMode('saas')}
                  class={`px-4 py-1.5 text-xs font-semibold rounded-md transition-all ${pricingMode === 'saas' ? 'bg-cyan-500 text-black' : 'text-slate-400'}`}
                >
                  Planned SaaS Plans
                </button>
                <button 
                  onClick={() => setPricingMode('rto_calc')}
                  class={`px-4 py-1.5 text-xs font-semibold rounded-md transition-all ${pricingMode === 'rto_calc' ? 'bg-cyan-500 text-black' : 'text-slate-400'}`}
                >
                  Interactive RTO Calculator
                </button>
              </div>
            </div>

            {pricingMode === 'saas' ? (
              <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="p-6 rounded-2xl border border-slate-800 bg-slate-900/40 space-y-4">
                  <div class="text-xs font-mono text-cyan-400">PLANNED PRICING</div>
                  <h3 class="text-xl font-bold text-white">Starter</h3>
                  <div class="text-3xl font-extrabold text-white">$199 <span class="text-xs text-slate-500 font-normal">/ month</span></div>
                  <p class="text-slate-400 text-xs">Up to 25,000 monthly evaluated transactions.</p>
                </div>

                <div class="p-6 rounded-2xl border border-cyan-500/40 bg-slate-900/80 space-y-4 relative">
                  <span class="absolute -top-3 right-4 px-2 py-0.5 bg-cyan-500 text-black text-[10px] font-bold uppercase rounded">
                    Scale
                  </span>
                  <div class="text-xs font-mono text-cyan-400">PLANNED PRICING</div>
                  <h3 class="text-xl font-bold text-white">Growth</h3>
                  <div class="text-3xl font-extrabold text-white">$499 <span class="text-xs text-slate-500 font-normal">/ month</span></div>
                  <p class="text-slate-400 text-xs">Up to 100,000 monthly evaluated transactions.</p>
                </div>

                <div class="p-6 rounded-2xl border border-slate-800 bg-slate-900/40 space-y-4">
                  <div class="text-xs font-mono text-cyan-400">PLANNED PRICING</div>
                  <h3 class="text-xl font-bold text-white">Enterprise</h3>
                  <div class="text-3xl font-extrabold text-white">$1,199 <span class="text-xs text-slate-500 font-normal">/ month</span></div>
                  <p class="text-slate-400 text-xs">Custom transaction volume & dedicated SLA.</p>
                </div>
              </div>
            ) : (
              <div class="p-8 rounded-2xl border border-slate-800 bg-slate-900/50 max-w-3xl mx-auto space-y-6">
                <div class="text-xs text-slate-400 italic text-center">
                  Illustrative estimate — actual savings depend on merchant-specific baseline data.
                </div>
                
                <div class="space-y-4">
                  <div>
                    <label class="text-xs text-slate-300 flex justify-between">
                      <span>Monthly Orders</span>
                      <span class="font-mono text-cyan-400">{monthlyOrders.toLocaleString()}</span>
                    </label>
                    <input 
                      type="range" min="1000" max="100000" step="1000" 
                      value={monthlyOrders} onChange={(e) => setMonthlyOrders(Number(e.target.value))}
                      class="w-full accent-cyan-500 mt-1" 
                    />
                  </div>

                  <div>
                    <label class="text-xs text-slate-300 flex justify-between">
                      <span>Baseline RTO Rate (%)</span>
                      <span class="font-mono text-cyan-400">{currentRtoRate}%</span>
                    </label>
                    <input 
                      type="range" min="5" max="40" step="1" 
                      value={currentRtoRate} onChange={(e) => setCurrentRtoRate(Number(e.target.value))}
                      class="w-full accent-cyan-500 mt-1" 
                    />
                  </div>
                </div>

                <div class="p-4 rounded-xl border border-slate-800 bg-slate-950 grid grid-cols-2 gap-4 text-center">
                  <div>
                    <div class="text-xs text-slate-500">ESTIMATED REDUCED RTO</div>
                    <div class="text-2xl font-bold text-emerald-400 font-mono mt-1">{rtoCalculations.reducedRate}%</div>
                  </div>
                  <div>
                    <div class="text-xs text-slate-500">ESTIMATED MONTHLY SAVINGS</div>
                    <div class="text-2xl font-bold text-cyan-400 font-mono mt-1">₹{rtoCalculations.monthlySavings.toLocaleString()}</div>
                  </div>
                </div>

                <div class="text-[11px] text-slate-500 text-center">
                  Illustrative ROI estimate based on the assumptions above.
                </div>
              </div>
            )}
          </section>

          <!-- Footer -->
          <footer class="mt-auto border-t border-slate-800/80 px-6 py-8 bg-[#0B0F17]">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              <TrustXLogo />
              <div class="text-xs text-slate-500">
                Trust-X — Transaction Risk Intelligence Infrastructure.
              </div>
              <button onClick={() => setIsAccessModalOpen(true)} class="text-xs text-cyan-400 hover:underline">
                Request Access
              </button>
            </div>
          </footer>

          <!-- Request API Access Modal -->
          {isAccessModalOpen && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="p-6 rounded-2xl border border-slate-800 bg-slate-900 max-w-md w-full space-y-4">
                <div class="flex justify-between items-center">
                  <h3 class="text-lg font-bold text-white">Request API Access</h3>
                  <button onClick={() => setIsAccessModalOpen(false)} class="text-slate-400 hover:text-white">✕</button>
                </div>
                {requestSubmitted ? (
                  <div class="text-sm text-emerald-400 py-4">
                    Thank you. Your access request has been recorded for the M10.1 staging access list.
                  </div>
                ) : (
                  <form onSubmit={(e) => { e.preventDefault(); setRequestSubmitted(true); }} class="space-y-4">
                    <div>
                      <label class="text-xs text-slate-400">Work Email</label>
                      <input type="email" required placeholder="engineering@merchant.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm mt-1 outline-none focus:border-cyan-500" />
                    </div>
                    <div>
                      <label class="text-xs text-slate-400">Estimated Monthly Volume</label>
                      <select class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm mt-1 outline-none focus:border-cyan-500">
                        <option>Under 10,000 orders/mo</option>
                        <option>10,000 - 50,000 orders/mo</option>
                        <option>50,000+ orders/mo</option>
                      </select>
                    </div>
                    <button type="submit" class="w-full py-2.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-black font-semibold text-sm">
                      Submit Access Request
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          <!-- API Docs Drawer -->
          {isDocsOpen && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex justify-end">
              <div class="w-full max-w-xl bg-slate-900 border-l border-slate-800 p-6 overflow-y-auto space-y-6">
                <div class="flex justify-between items-center pb-4 border-b border-slate-800">
                  <h3 class="text-lg font-bold text-white font-mono">POST /v1/risk/evaluate</h3>
                  <button onClick={() => setIsDocsOpen(false)} class="text-slate-400 hover:text-white">✕</button>
                </div>
                <div class="space-y-4 text-xs font-mono text-slate-300">
                  <div>
                    <span class="text-slate-500">// Request Payload Structure</span>
                    <pre class="p-3 rounded-lg bg-slate-950 border border-slate-800 mt-1">{`{
  "order_id": "ORD_99182",
  "amount": 2499.00,
  "currency": "INR",
  "payment_method": "COD",
  "customer": {
    "phone_hash": "a8f9c...",
    "address_history": "unverified"
  }
}`}</pre>
                  </div>
                  <div>
                    <span class="text-slate-500">// Response Threshold Contract</span>
                    <ul class="list-disc pl-4 space-y-1 mt-1 text-slate-400">
                      <li><strong class="text-red-400">70+ Risk Score:</strong> INSPECT (PREPAID_REQUIRED)</li>
                      <li><strong class="text-amber-400">50-69 Risk Score:</strong> REVIEW (MANUAL_REVIEW)</li>
                      <li><strong class="text-yellow-400">40-49 Risk Score:</strong> VERIFY (ADDITIONAL_VERIFICATION)</li>
                      <li><strong class="text-emerald-400">Below 40:</strong> APPROVE (APPROVE)</li>
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
